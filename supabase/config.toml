# Supabase CLI config for Platinum Point Automotive Engineering.
# Link with:  npx supabase link --project-ref aonpdrqtosmqhmomghca
# Apply schema:  npx supabase db push
# Deploy function:  npx supabase functions deploy submit
project_id = "platinum-point"

[db]
major_version = 17

# No public sign-up (ADR-0007). Accounts are created deliberately by an owner via the
# `admin-invite` function; a new user still lands inactive (see the profile migration)
# and an owner must activate them. Mirror this in the hosted project dashboard —
# config.toml only governs local `supabase start` unless pushed.
[auth]
enable_signup = false

[functions.submit]
verify_jwt = false

[functions.admin-invite]
verify_jwt = true

[functions.rebuild]
verify_jwt = true

[functions.notify-customer]
verify_jwt = true
