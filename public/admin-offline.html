<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <meta name="robots" content="noindex,nofollow" />
    <meta name="color-scheme" content="light dark" />
    <title>Offline — PMS Admin</title>
    <!-- Served by public/admin-sw.js when an admin page can't load. Self-contained: no
         network requests, so it renders with no connection at all. -->
    <style>
      :root {
        --ground: #f7f7f5;
        --ink: #14171a;
        --muted: #5b6168;
        --line: #d9dcdf;
      }
      @media (prefers-color-scheme: dark) {
        :root {
          --ground: #14171a;
          --ink: #f7f7f5;
          --muted: #a3a9b0;
          --line: #2c3136;
        }
      }
      * {
        box-sizing: border-box;
      }
      body {
        margin: 0;
        min-height: 100dvh;
        display: grid;
        place-items: center;
        padding: 24px;
        background: var(--ground);
        color: var(--ink);
        font-family:
          system-ui,
          -apple-system,
          'Segoe UI',
          Roboto,
          sans-serif;
        text-align: center;
      }
      main {
        max-width: 22rem;
      }
      svg {
        width: 64px;
        height: 64px;
        border-radius: 12px;
        box-shadow: 0 0 0 1px var(--line);
      }
      h1 {
        margin: 20px 0 8px;
        font-size: 1.5rem;
        letter-spacing: -0.01em;
      }
      p {
        margin: 0 0 24px;
        color: var(--muted);
        line-height: 1.5;
      }
      button {
        min-height: 44px;
        padding: 0 24px;
        border: 1px solid var(--line);
        border-radius: 8px;
        background: #c8752a;
        color: #14171a;
        font: inherit;
        font-weight: 600;
        cursor: pointer;
      }
      button:focus-visible {
        outline: 2px solid var(--ink);
        outline-offset: 2px;
      }
    </style>
  </head>
  <body>
    <main>
      <svg viewBox="0 0 100 100" aria-hidden="true">
        <rect width="100" height="100" rx="18" fill="#14171A" />
        <g fill="none" stroke="#F7F7F5" stroke-width="8" stroke-linejoin="bevel">
          <path d="M21 76V24h13a12.5 12.5 0 0 1 0 25H21" />
          <path d="M57 76V24l11 25 11-25v52" />
        </g>
        <circle cx="68" cy="49" r="6" fill="#C8752A" />
      </svg>
      <h1>You're offline</h1>
      <p>PMS Admin needs a connection to load your jobs and bookings.</p>
      <button type="button" onclick="location.reload()">Try again</button>
    </main>
  </body>
</html>
